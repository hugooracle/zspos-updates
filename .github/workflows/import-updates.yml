name: Import ZSPOS update files

on:
  push:
    paths:
      - ".github/workflows/import-updates.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download files
        shell: bash
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36"

          curl --fail --location --retry 3 --connect-timeout 20 --max-time 60 \
            --user-agent "$UA" \
            "https://www.kkinova.com/downloads/get.php?f=ZSPOS.ini" \
            --output "ZSPOS.ini"

          curl --fail --location --retry 3 --connect-timeout 20 --max-time 60 \
            --user-agent "$UA" \
            "https://www.kkinova.com/downloads/get.php?f=EQZ_RDC-Fidelizacao.zstheme" \
            --output "EQZ_RDC-Fidelizacao.zstheme"

          curl --fail --location --retry 3 --connect-timeout 20 --max-time 60 \
            --user-agent "$UA" \
            "https://www.kkinova.com/downloads/get.php?f=CONFIG.CASH.xml" \
            --output "CONFIG.CASH.xml"

      - name: Verify exact files from supplied ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "1872d0b110f191a8ed8c3ec05800fb77d563ee6115ec0b86030a43faa5a6413b  ZSPOS.ini" > SHA256SUMS
          echo "4f1c0dac14a4ded3a48b4709c42ea92e5d9ba08e472aec3f88f6a72c5c49ac21  EQZ_RDC-Fidelizacao.zstheme" >> SHA256SUMS
          echo "dd49f669667c72941905ff4f5c5267f6f0c8b0bc7c721d2d14a7b9d9133bb875  CONFIG.CASH.xml" >> SHA256SUMS
          sha256sum --check SHA256SUMS
          rm SHA256SUMS

      - name: Commit verified files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ZSPOS.ini EQZ_RDC-Fidelizacao.zstheme CONFIG.CASH.xml

          if git diff --cached --quiet; then
            echo "Files are already up to date."
            exit 0
          fi

          git commit -m "Import verified ZSPOS update files"
          git push
